name: Update league data

on:
  schedule:
    - cron: "0 11 * * 2"   # Tuesday 11:00 UTC, after Monday Night Football
    - cron: "0 13 * * 3"   # Wednesday 13:00 UTC, re-pull after stat corrections
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:                     # uploading a new issue rebuilds the site automatically
    branches: [main]
    paths:
      - "data/issues/**"
      - "data/issues.json"
      - "data/seasons.json"
      - "data/managers.json"
      - "data/settings.json"
      - "data/history.json"
      - "data/ledger.json"
      - "data/receipts.json"
      - "data/bios/**"
      - "scripts/**"
      - "css/**"
      - "js/**"

permissions:
  contents: write

# One run at a time. A second trigger (an upload while the Tuesday run is mid-build, or two quick uploads)
# waits in line instead of racing the first one to push, so the last upload always gets its own full rebuild.
concurrency:
  group: update-league-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Pull Sleeper data
        run: python scripts/sleeper_pull.py

      - name: Pull FantasyCalc values and build portfolios
        continue-on-error: true
        run: python scripts/pull_values.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Build manager pages
        run: python scripts/build_managers.py

      - name: Build Hall of Fame and League History page
        run: python scripts/build_history.py

      - name: Pull NFL player stats for pick grading
        continue-on-error: true
        run: python scripts/pull_player_stats.py

      - name: Value trades and picks with FantasyCalc
        continue-on-error: true
        run: python scripts/ledger_values.py

      - name: Build Draft and Trade Ledger page
        run: python scripts/build_ledger.py

      - name: Build Receipts Archive page
        run: python scripts/build_receipts.py

      - name: Write one-file brief for the next issue
        run: python scripts/make_brief.py

      - name: Commit changes
        run: |
          git config user.name "dynastree-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data index.html issues managers history ledger receipts assets/avatars
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update league data"
          # If someone uploaded a file while this run was building, pick it up and retry the push.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "Push attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          echo "Could not push after 3 attempts."
          exit 1
