name: Update league data

on:
  schedule:
    - cron: "0 11 * * 2"   # Tuesday 11:00 UTC, after Monday Night Football
    - cron: "0 13 * * 3"   # Wednesday 13:00 UTC, re-pull after stat corrections
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:                     # uploading a new issue rebuilds the site automatically
    branches: [main]
    paths:
      - "data/issues/**"
      - "data/issues.json"
      - "data/seasons.json"
      - "data/*/fut_cap.json"
      - "data/managers.json"
      - "data/settings.json"
      - "data/history.json"
      - "data/ledger.json"
      - "data/receipts.json"
      - "data/bios/**"
      - "scripts/**"
      - "css/**"
      - "js/**"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Pull Sleeper data
        run: python scripts/sleeper_pull.py

      - name: Build site
        run: python scripts/build_site.py

      - name: Build manager pages
        run: python scripts/build_managers.py

      - name: Build Hall of Fame and League History page
        run: python scripts/build_history.py

      - name: Pull NFL player stats for pick grading
        continue-on-error: true
        run: python scripts/pull_player_stats.py

      - name: Build Draft and Trade Ledger page
        run: python scripts/build_ledger.py

      - name: Build Receipts Archive page
        run: python scripts/build_receipts.py

      - name: Write one-file brief for the next issue
        run: python scripts/make_brief.py

      - name: Commit changes
        run: |
          git config user.name "dynastree-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data index.html issues managers history ledger receipts assets/avatars
          git diff --cached --quiet || (git commit -m "Update league data" && git push)
